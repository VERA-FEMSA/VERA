name: Preview role acceptance

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: Full HTTPS origin of an isolated VERA preview deployment
        required: true
        type: string

permissions:
  contents: read

jobs:
  roles:
    name: Demo roles and read-only API contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check isolated preview
        env:
          VERA_PREVIEW_URL: ${{ inputs.preview_url }}
        run: node scripts/preview-role-acceptance.mjs

      - name: Upload timestamped evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vera-preview-roles-${{ github.run_id }}-${{ github.run_attempt }}
          path: quality-report/preview-role-acceptance.json
          if-no-files-found: error
          retention-days: 14
