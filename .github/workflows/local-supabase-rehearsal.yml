name: Local Supabase migration and restore rehearsal

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-supabase-rehearsal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-database:
    name: Migrations, private access and synthetic restore
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check disposable local Supabase
        run: bash scripts/local-supabase-rehearsal.sh

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vera-local-supabase-${{ github.run_id }}-${{ github.run_attempt }}
          path: quality-report/local-supabase-rehearsal.json
          if-no-files-found: warn
          retention-days: 14
