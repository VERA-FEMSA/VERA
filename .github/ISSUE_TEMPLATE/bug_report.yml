name: Defecto reproducible
description: Reporta un fallo técnico sin incluir datos sensibles.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Para vulnerabilidades o secretos, usa el reporte privado de Security en vez de un issue público."
  - type: input
    id: revision
    attributes:
      label: Commit o versión
      description: Indica el SHA, rama o despliegue observado.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Entorno
      description: Local, Preview o Production; navegador y dispositivo si aplica.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impacto observado
      description: Describe el efecto del defecto; esta selección no asigna automáticamente una prioridad.
      options:
        - Alto — bloquea un flujo principal o afecta la integridad de datos
        - Medio — limita una función con alternativa disponible
        - Bajo — afecta un detalle sin bloquear el flujo
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      description: Usa cuentas y datos sintéticos.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado y observado
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia y alcance
      description: Puedes enlazar logs redactados o un PR; no adjuntes tokens, claves ni datos personales.
    validations:
      required: false
  - type: textarea
    id: regression
    attributes:
      label: Verificación para evitar la regresión
      description: Enlaza una prueba automatizada o describe los pasos para repetir la comprobación después de corregir el defecto. Si aún no existe, indica «pendiente».
    validations:
      required: false
