    <style>
      .vera-transition {
        position: fixed;
        z-index: 10000;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background-color: rgba(31, 113, 86, .4);
        -webkit-backdrop-filter: blur(18px) saturate(.72);
        backdrop-filter: blur(18px) saturate(.72);
        color: #fff;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .vera-transition::before {
        position: absolute;
        inset: -35%;
        background: radial-gradient(circle at center, rgba(232, 91, 96, .6) 0%, rgba(191, 66, 70, .4) 27%, rgba(160, 57, 65, .12) 49%, transparent 68%);
        content: "";
        opacity: 0;
        transform: scale(.6);
      }
      .vera-transition::after {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, transparent 18%, rgba(9, 26, 29, .16) 100%);
        content: "";
      }
      .vera-transition--play { animation: vera-transition-glass 1000ms ease-in-out both; }
      .vera-transition--play::before { animation: vera-transition-light 1000ms ease-in-out both; }
      .vera-transition__identity { position: relative; z-index: 1; display: flex; align-items: center; gap: 17px; text-shadow: 0 2px 16px rgba(13, 39, 37, .32); }
      .vera-transition--play .vera-transition__identity { animation: vera-transition-logo 1000ms ease-in-out both; }
      .vera-transition__mark { display: grid; place-items: center; width: 72px; height: 72px; border-radius: 18px; background: #fff; }
      .vera-transition__mark img { display: block; width: 58px; height: 58px; }
      .vera-transition__name strong { display: block; font: 750 41px/1 system-ui, sans-serif; letter-spacing: .015em; }
      .vera-transition__name small { display: block; margin-top: 5px; font: 700 10px/1.3 system-ui, sans-serif; letter-spacing: .19em; }
      @keyframes vera-transition-light {
        0%, 18% { opacity: 0; transform: scale(.6); }
        58% { opacity: .8; transform: scale(1); }
        78% { opacity: .92; transform: scale(1.35); }
        100% { opacity: 0; transform: scale(1.7); }
      }
      @keyframes vera-transition-glass {
        0%, 22% { opacity: 1; visibility: visible; background-color: rgba(31, 113, 86, .4); }
        56% { opacity: 1; background-color: rgba(104, 84, 72, .38); }
        78% { opacity: 1; background-color: rgba(191, 66, 70, .4); }
        100% { opacity: 0; visibility: hidden; background-color: rgba(191, 66, 70, .1); }
      }
      @keyframes vera-transition-logo {
        0%, 48% { opacity: 1; transform: scale(1); }
        78% { opacity: 1; transform: scale(1.015); }
        100% { opacity: 0; transform: scale(1.04); }
      }
      @media (prefers-reduced-motion: reduce) {
        .vera-transition, .vera-transition--play { display: none; animation: none; }
      }
    </style>
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:site_name" content="VERA Digital Systems" />
    <meta property="og:title" content="VERA | Decisiones de auditoría con fundamento" />
    <meta property="og:description" content="De la propuesta al seguimiento, con riesgos, controles y evidencia en cada paso." />

    <meta name="twitter:card" content="summary_large_image" />

    <title>VERA | Auditorías, riesgos y evidencia</title>
    <script>
      try {
        const saved = localStorage.getItem('vera:appearance');
        const preference = ['system', 'light', 'dark', 'contrast', 'femsa'].includes(saved) ? saved : 'femsa';
        const dark = preference === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : ['dark', 'contrast', 'femsa'].includes(preference);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        if (preference === 'contrast') document.documentElement.dataset.contrast = 'high';
        else delete document.documentElement.dataset.contrast;
        if (preference === 'femsa') document.documentElement.dataset.brand = 'femsa';
        else delete document.documentElement.dataset.brand;
        if (localStorage.getItem('vera:navigation-collapsed') === 'true') document.documentElement.dataset.navCollapsed = 'true';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = preference === 'femsa' ? '#121a24' : dark ? '#0d1923' : '#f4f6f7';
      } catch {
        document.documentElement.dataset.theme = 'dark';
        document.documentElement.dataset.brand = 'femsa';
        document.documentElement.style.colorScheme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="vera-first-frame" class="vera-transition vera-transition--play" aria-hidden="true">
      <div class="vera-transition__identity">
        <span class="vera-transition__mark"><img src="/vera-logo.svg" width="58" height="58" alt="" /></span>
        <span class="vera-transition__name"><strong>VERA</strong><small>DIGITAL SYSTEMS</small></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
